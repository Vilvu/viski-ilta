name: Infra Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets (AZURE_CREDENTIALS, COSMOS_KEY, ANTHROPIC_API_KEY) are environment-scoped;
    # without this they resolve to empty strings.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure
        run: |
          az deployment sub create \
            --name "whiskyapp-infra-${{ inputs.environment }}-$(date +%Y%m%d-%H%M%S)" \
            --location northeurope \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${{ inputs.environment }}.bicepparam \
            --parameters cosmosKey=${{ secrets.COSMOS_KEY }} \
            --parameters anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}